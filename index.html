<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroFila — COPLACANA UDG QUIRINÓPOLIS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f1;color:#173b28}
header{background:#176b3a;color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:900}
main{max-width:560px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px #0001}
h1{font-size:25px;margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #ccd8ce;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:11px;background:#176b3a;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin-top:16px}
.hidden{display:none}.pos{font-size:54px;text-align:center;font-weight:900;color:#176b3a}.msg{text-align:center;margin-top:12px;color:#667}
.error{background:#fee;border:1px solid #e99;padding:12px;border-radius:10px;color:#922;margin-top:12px}
</style></head>
<body>
<header>🌾 AGROFILA — COPLACANA UDG QUIRINÓPOLIS</header>
<main>
<section id="home" class="card">
<h1>Marque sua vez na fila</h1>
<p>Informe seus dados para entrar na fila de carregamento ou descarregamento.</p>
<button onclick="showForm()">ENTRAR NA FILA</button>
</section>

<section id="form" class="card hidden">
<h1>Entrada na fila</h1>
<label>Nome</label><input id="name" autocomplete="name">
<label>Celular</label><input id="phone" autocomplete="tel">
<label>Placa</label><input id="plate" style="text-transform:uppercase">
<label>Tipo de veículo</label><select id="vehicle"><option>Carreta</option><option>Truck</option><option>Bitrem</option><option>Rodotrem</option><option>Outro</option></select>
<label>Operação</label><select id="operation"><option value="CARGA">Carga</option><option value="DESCARGA">Descarga</option></select>
<label>Produto</label><select id="product"><option>Soja</option><option>Milho</option><option>Outro</option></select>
<button onclick="joinQueue()">ENTRAR NA FILA</button><div id="error" class="error hidden"></div>
</section>

<section id="ticket" class="card hidden">
<h1>Entrada confirmada</h1><p id="summary"></p>
<div class="pos" id="position">—</div><div class="msg">SUA POSIÇÃO NA FILA</div>
<p id="status" class="msg">Aguardando chamada.</p>
<button onclick="location.reload()">SAIR</button>
</section>
</main>
<script>
const cfg=window.AGROFILA_CONFIG||{};
const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
const UNIT="COPLACANA-UDG-QUIRINOPOLIS";let ticketId=null;let accessToken=null;
function show(id){["home","form","ticket"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function showForm(){show("form")}
function err(t){let e=document.getElementById("error");e.textContent=t;e.classList.remove("hidden")}
async function joinQueue(){
  const nameValue = document.getElementById('name').value.trim();
  const phoneValue = document.getElementById('phone').value.trim();
  const plateValue = document.getElementById('plate').value.trim().toUpperCase();
  const vehicleValue = document.getElementById('vehicle').value;
  const operationValue = document.getElementById('operation').value;
  const productValue = document.getElementById('product').value;

  const errorBox = document.getElementById('error');
  errorBox.classList.add('hidden');

  if(!nameValue || !phoneValue || !plateValue){
    err('Preencha nome, celular e placa.');
    return;
  }

  const button = document.querySelector('#form button');
  button.disabled = true;
  button.textContent = 'ENTRANDO...';

  try {
    const {data, error} = await client.rpc('join_agrofila_queue', {
      p_name: nameValue,
      p_phone: phoneValue,
      p_plate: plateValue,
      p_vehicle_type: vehicleValue,
      p_operation: operationValue,
      p_product: productValue
    });

    if(error){
      console.error(error);
      err('Erro ao entrar na fila: ' + error.message);
      return;
    }

    const ticket = data && data[0];

    if(!ticket){
      err('O banco não gerou a senha da fila.');
      return;
    }

    ticketId = ticket.id;
    accessToken = ticket.access_token;

    localStorage.setItem('agrofila_ticket_id', ticketId);
    localStorage.setItem('agrofila_access_token', accessToken);

    show('ticket');
    await refresh();

  } catch(e) {
    console.error(e);
    err('Erro de conexão: ' + (e.message || e));

  } finally {
    button.disabled = false;
    button.textContent = 'ENTRAR NA FILA';
  }
}
async function refresh(){
 if(!ticketId)return;
 const {data,error}=await client.rpc("get_agrofila_ticket",{p_access_token:accessToken});
 const t=data&&data[0];
 if(error||!t)return;
 summary.textContent=`${t.name} • ${t.plate} • ${t.operation==="CARGA"?"Carga":"Descarga"} • ${t.product}`;
 status.textContent=t.status==="AGUARDANDO"?"Aguardando chamada.":t.status==="CHAMADO"?"🚛 VEÍCULO CHAMADO — dirija-se à balança.":t.status==="EM_ATENDIMENTO"?"Em atendimento.":t.status==="FINALIZADO"?"Operação finalizada.":"Registro encerrado.";
position.textContent=t.queue_number||1;
}
function subscribe(){
 client.channel("agrofila-ticket-"+ticketId).on("postgres_changes",{event:"*",schema:"public",table:"queue_entries",filter:"id=eq."+ticketId},refresh).subscribe();
}
const saved=localStorage.getItem("agrofila_ticket_id"),savedToken=localStorage.getItem("agrofila_access_token");if(saved&&savedToken){ticketId=saved;accessToken=savedToken;show("ticket");refresh()} setInterval(refresh,5000);
</script></body></html>
