<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AgroFila — COPLACANA UDG QUIRINÓPOLIS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f1;
  color:#173b28;
}

header{
  background:#176b3a;
  color:#fff;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

main{
  max-width:560px;
  margin:28px auto;
  padding:0 16px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 28px #0001;
}

h1{
  font-size:25px;
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:12px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccd8ce;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#176b3a;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  margin-top:16px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.hidden{
  display:none;
}

.pos{
  font-size:54px;
  text-align:center;
  font-weight:900;
  color:#176b3a;
}

.msg{
  text-align:center;
  margin-top:12px;
  color:#667;
}

.error{
  background:#fee;
  border:1px solid #e99;
  padding:12px;
  border-radius:10px;
  color:#922;
  margin-top:12px;
}

</style>

</head>

<body>

<header>
🌾 AGROFILA — COPLACANA UDG QUIRINÓPOLIS
</header>

<main>

<!-- TELA INICIAL -->

<section id="home" class="card">

<h1>Marque sua vez na fila</h1>

<p>
Informe seus dados para entrar na fila de carregamento ou descarregamento.
</p>

<button onclick="showForm()">
ENTRAR NA FILA
</button>

</section>


<!-- FORMULÁRIO -->

<section id="form" class="card hidden">

<h1>Entrada na fila</h1>

<label>Nome</label>
<input
  id="name"
  autocomplete="name"
>

<label>Celular</label>
<input
  id="phone"
  autocomplete="tel"
>

<label>Placa</label>
<input
  id="plate"
  style="text-transform:uppercase"
>

<label>Tipo de veículo</label>

<select id="vehicle">

<option value="Carreta">Carreta</option>
<option value="Truck">Truck</option>
<option value="Bitrem">Bitrem</option>
<option value="Rodotrem">Rodotrem</option>
<option value="Outro">Outro</option>

</select>


<label>Operação</label>

<select id="operation">

<option value="CARGA">Carga</option>
<option value="DESCARGA">Descarga</option>

</select>


<label>Produto</label>

<select id="product">

<option value="Soja">Soja</option>
<option value="Milho">Milho</option>
<option value="Outro">Outro</option>

</select>


<button id="joinButton" onclick="joinQueue()">
ENTRAR NA FILA
</button>

<div id="error" class="error hidden"></div>

</section>


<!-- RECUPERAÇÃO DE SENHA -->

<section id="recovery" class="card hidden">

<h1>Nova senha</h1>

<p>
Digite uma nova senha para acessar a Balança do AgroFila.
</p>

<label>Nova senha</label>

<input
  id="newPassword"
  type="password"
  placeholder="Digite a nova senha"
>

<label>Confirmar nova senha</label>

<input
  id="confirmPassword"
  type="password"
  placeholder="Digite novamente a senha"
>

<button onclick="updatePassword()">
SALVAR NOVA SENHA
</button>

<div id="recoveryError" class="error hidden"></div>

<p id="recoverySuccess" class="msg"></p>

</section><!-- TICKET -->

<section id="ticket" class="card hidden">

<h1>Entrada confirmada</h1>

<p id="summary"></p>

<p id="entryDate" class="msg"></p>

<div class="pos" id="position">
—
</div>

<div class="msg">
SUA POSIÇÃO NA FILA
</div>

<p id="status" class="msg">
Aguardando chamada.
</p>

<button onclick="exitTicket()">
SAIR
</button>

</section>

</main>


<script>

const cfg = window.AGROFILA_CONFIG || {};

if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) {
  console.error("Configuração do Supabase não encontrada.");
}

const client = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_KEY
);
client.auth.onAuthStateChange(function(event) {

  if (event === "PASSWORD_RECOVERY") {
    show("recovery");
  }

});

const UNIT = "COPLACANA-UDG-QUIRINOPOLIS";


let ticketId = null;
let accessToken = null;
let realtimeChannel = null;


/* =========================
   TROCAR DE TELA
========================= */

function show(id) {

  ["home","form","ticket","recovery"].forEach(function(x) {

    const element = document.getElementById(x);

    if (element) {
      element.classList.toggle(
        "hidden",
        x !== id
      );
    }

  });

}


/* =========================
   ABRIR FORMULÁRIO
========================= */

function showForm() {

  show("form");

}


/* =========================
   MOSTRAR ERRO
========================= */

function err(message) {

  const errorBox =
    document.getElementById("error");

  if (!errorBox) return;

  errorBox.textContent = message;

  errorBox.classList.remove("hidden");

}


/* =========================
   SAIR DA FILA / LIMPAR
========================= */

function exitTicket() {

  localStorage.removeItem(
    "agrofila_ticket_id"
  );

  localStorage.removeItem(
    "agrofila_access_token"
  );

  ticketId = null;
  accessToken = null;


  if (realtimeChannel) {

    client.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;

  }


  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("plate").value = "";


  document.getElementById("position").textContent = "—";

  document.getElementById("status").textContent =
    "Aguardando chamada.";


  show("home");

}


/* =========================
   ENTRAR NA FILA
========================= */

async function joinQueue() {

  const nameValue =
    document.getElementById("name")
      .value
      .trim();

  const phoneValue =
    document.getElementById("phone")
      .value
      .trim();

  const plateValue =
    document.getElementById("plate")
      .value
      .trim()
      .toUpperCase();

  const vehicleValue =
    document.getElementById("vehicle")
      .value;

  const operationValue =
    document.getElementById("operation")
      .value;

  const productValue =
    document.getElementById("product")
      .value;


  const errorBox =
    document.getElementById("error");

  errorBox.classList.add("hidden");


  if (
    !nameValue ||
    !phoneValue ||
    !plateValue
  ) {

    err(
      "Preencha nome, celular e placa."
    );

    return;

  }


  const button =
    document.getElementById("joinButton");


  button.disabled = true;

  button.textContent =
    "ENTRANDO...";


  try {

    const result =
      await client.rpc(
        "join_agrofila_queue",
        {
          p_name: nameValue,
          p_phone: phoneValue,
          p_plate: plateValue,
          p_vehicle_type: vehicleValue,
          p_operation: operationValue,
          p_product: productValue
        }
      );


    if (result.error) {

      console.error(
        "Erro AgroFila:",
        result.error
      );

      err(
        "Erro ao entrar na fila: " +
        result.error.message
      );

      return;

    }


    const ticket =
      result.data &&
      result.data[0];


    if (!ticket) {

      err(
        "O banco não gerou a senha da fila."
      );

      return;

    }


    ticketId =
      ticket.id;

    accessToken =
      ticket.access_token;


    localStorage.setItem(
      "agrofila_ticket_id",
      ticketId
    );

    localStorage.setItem(
      "agrofila_access_token",
      accessToken
    );


    show("ticket");


    await refresh();


    subscribe();


  } catch (e) {

    console.error(e);

    err(
      "Erro de conexão: " +
      (e.message || e)
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "ENTRAR NA FILA";

  }

}


/* =========================
   ATUALIZAR TICKET
========================= */

async function refresh() {

  if (
    !ticketId ||
    !accessToken
  ) {

    return;

  }


  try {

    const result =
      await client.rpc(
        "get_agrofila_ticket",
        {
          p_access_token:
            accessToken
        }
      );


    if (result.error) {

      console.error(
        "Erro ao consultar ticket:",
        result.error
      );

      return;

    }


    const ticket =
      result.data &&
      result.data[0];


    if (!ticket) {

      return;

    }


    document.getElementById(
      "summary"
    ).textContent =

      `${ticket.name} • ${ticket.plate} • ${
        ticket.operation === "CARGA"
          ? "Carga"
          : "Descarga"
      } • ${ticket.product}`;
document.getElementById("entryDate").textContent =
  "Entrada na fila: " +
  new Date(ticket.created_at).toLocaleString(
    "pt-BR",
    {
      timeZone: "America/Sao_Paulo",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

    document.getElementById(
      "position"
    ).textContent =

     ticket.queue_position


    let statusText =
      "Registro encerrado.";


    if (
      ticket.status === "AGUARDANDO"
    ) {

      statusText =
        "Aguardando chamada.";

    }


    else if (
      ticket.status === "CHAMADO"
    ) {

      statusText =
        "🚛 VEÍCULO CHAMADO — dirija-se à balança.";

    }


    else if (
      ticket.status === "EM_ATENDIMENTO"
    ) {

      statusText =
        "Em atendimento.";

    }


    else if (
      ticket.status === "FINALIZADO"
    ) {

      statusText =
        "Operação finalizada.";

    }


    else if (
      ticket.status === "CANCELADO"
    ) {

      statusText =
        "Registro cancelado.";

    }


    document.getElementById(
      "status"
    ).textContent =
      statusText;


  } catch (e) {

    console.error(
      "Erro refresh:",
      e
    );

  }

}

/* =========================
   RECUPERAÇÃO DE SENHA
========================= */

async function updatePassword() {

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const errorBox =
    document.getElementById("recoveryError");

  const successBox =
    document.getElementById("recoverySuccess");

  errorBox.classList.add("hidden");
  successBox.textContent = "";

  if (!newPassword || !confirmPassword) {

    errorBox.textContent =
      "Preencha os dois campos.";

    errorBox.classList.remove("hidden");

    return;
  }

  if (newPassword.length < 6) {

    errorBox.textContent =
      "A senha deve ter pelo menos 6 caracteres.";

    errorBox.classList.remove("hidden");

    return;
  }

  if (newPassword !== confirmPassword) {

    errorBox.textContent =
      "As senhas não são iguais.";

    errorBox.classList.remove("hidden");

    return;
  }

  const result =
    await client.auth.updateUser({
      password: newPassword
    });

  if (result.error) {

    errorBox.textContent =
      "Erro ao alterar a senha: " +
      result.error.message;

    errorBox.classList.remove("hidden");

    return;
  }

  successBox.textContent =
    "Senha alterada com sucesso! Você já pode acessar a Balança.";

}
/* =========================
   TEMPO REAL
========================= */

function subscribe() {

  if (!ticketId) {
    return;
  }


  if (realtimeChannel) {

    client.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    client
      .channel(
        "agrofila-ticket-" +
        ticketId
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "queue_entries",
          filter:
            "id=eq." +
            ticketId
        },
        function() {

          refresh();

        }
      )
      .subscribe();

}


/* =========================
   RECUPERAR TICKET SALVO
========================= */
/* =========================
   DETECTAR RECUPERAÇÃO DE SENHA
========================= */

client.auth.onAuthStateChange(
  async function(event) {

    if (event === "PASSWORD_RECOVERY") {

      show("recovery");

    }

  }
);
const saved =
  localStorage.getItem(
    "agrofila_ticket_id"
  );


const savedToken =
  localStorage.getItem(
    "agrofila_access_token"
  );


if (
  saved &&
  savedToken
) {

  ticketId =
    saved;

  accessToken =
    savedToken;


  show("ticket");


  refresh();


  subscribe();

}


/* =========================
   ATUALIZAÇÃO AUTOMÁTICA
========================= */

setInterval(
  refresh,
  5000
);

</script>

</body>

</html>
