<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroFila — Tela da Balança</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f1;color:#173b28}
header{background:#176b3a;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.unit{font-size:13px;margin-top:4px}.clock{background:#0f572e;padding:10px 14px;border-radius:10px;font-weight:800}
main{max-width:1500px;margin:auto;padding:22px}.login,.toolbar,.panel,.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 14px #0001}.login{max-width:420px;margin:60px auto}
input,select{padding:12px;border:1px solid #ccd8ce;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#176b3a;color:#fff}.lime{background:#d8f22b;color:#173b28}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat small{color:#607067}.stat strong{display:block;font-size:30px;margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar input{min-width:280px}.tabs button.active{background:#176b3a;color:#fff}.tabs button:not(.active){background:#e8efe9;color:#176b3a}
  .tabs button[data-filter="DESCARGA"]{background:#f28c28;color:#fff}
.tabs button[data-filter="CARGA"]{background:#176b3a;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel h2{margin-top:0}.queue{display:flex;flex-direction:column;gap:10px}.card{border:1px solid #dce5df;border-radius:12px;padding:14px;display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center}.pos{font-size:28px;font-weight:900;color:#176b3a;text-align:center}.plate{font-size:19px;font-weight:900}.meta{font-size:13px;color:#5d6e64;margin-top:4px}.badge{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:#edf5ef;color:#176b3a;font-size:11px;font-weight:800}.actions{display:flex;flex-direction:column;gap:6px}.call{background:#176b3a;color:#fff}.arrive{background:#e9f4ed;color:#176b3a}.finish{background:#e9edf8;color:#284c9a}.danger{background:#f8e8e8;color:#9a2d2d}.hidden{display:none}.empty{text-align:center;padding:30px;color:#7a897f}.err{color:#922;background:#fee;padding:10px;border-radius:8px;margin-top:10px}
@media(max-width:900px){.stats{grid-template-columns:2fr 2fr}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><div class="brand">🌾 AGROFILA — TELA DA BALANÇA</div><div class="unit">COPLACANA UDG QUIRINÓPOLIS</div></div><div class="clock" id="clock"></div></header>
<main>
<section id="login" class="login"><h2>Acesso da Balança</h2><p>Entre com o usuário da equipe da balança.</p><input id="email" type="email" placeholder="E-mail"><br><br><input id="password" type="password" placeholder="Senha"><button class="primary" style="width:100%;margin-top:12px" onclick="login()">ENTRAR</button><div id="loginErr" class="err hidden"></div></section>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><small>AGUARDANDO</small><strong id="total">0</strong></div><div class="stat" style="border-top:5px solid #f28c28"><small style="color:#f28c28;font-weight:800">DESCARGA</small><strong id="descarga">0</strong></div><div class="stat" style="border-top:5px solid #176b3a"><small style="color:#176b3a;font-weight:800">CARGA</small><strong id="carga">0</strong></div>
<div class="toolbar"><div id="userProfile" style="font-weight:800;color:#176b3a;margin-right:8px"></div><div class="tabs"><button class="active" data-filter="TODOS">Todos</button><button data-filter="DESCARGA">Descarga</button><button data-filter="CARGA">Carga</button></div><input id="search" placeholder="🔎 Placa ou motorista"><select id="product"><option value="">Todos os produtos</option><option>Soja</option><option>Milho</option><option>Outro</option></select><button id="callNextBtn" class="lime" onclick="callNext()">CHAMAR PRÓXIMO</button>
  <button onclick="location.href='relatorio-pesagens.html'">RELATÓRIO DE PESAGENS</button><button onclick="logout()">SAIR</button></div>
<div class="grid"><div class="panel"><h2 style="color:#f28c28">📦 FILA DE DESCARGA</h2><div id="descargaList" class="queue"></div></div><div class="panel"><h2 style="color:#176b3a">🚚 FILA DE CARGA</h2><div id="cargaList" class="queue"></div></div></div>
</section></main>
<script>
const cfg=window.AGROFILA_CONFIG||{};const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);const UNIT="COPLACANA-UDG-QUIRINOPOLIS";let filter="TODOS",rows=[],currentProfile=null;
function login(){sb.auth.signInWithPassword({email:email.value,password:password.value}).then(({error})=>{if(error){loginErr.textContent=error.message;loginErr.classList.remove("hidden")}else start()})}
async function start(){
  try{
    const {data:{user},error:userError}=await sb.auth.getUser();
    if(userError||!user) throw userError||new Error("Usuário não autenticado");

    const {data,error}=await sb.from("agrofila_profiles")
      .select("nome,perfil")
      .eq("user_id",user.id)
      .eq("ativo",true)
      .single();

    if(error) throw error;

    currentProfile=data;
    document.getElementById("callNextBtn").style.display=
  data.perfil==="BALANCA" ? "" : "none";

    document.getElementById("userProfile").textContent =
      `${data.nome} — ${data.perfil}`;

    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    await load();
    subscribe();
  }catch(error){
    document.getElementById("loginErr").textContent =
      "Usuário sem perfil AgroFila cadastrado.";
    document.getElementById("loginErr").classList.remove("hidden");
    await sb.auth.signOut();
  }
}
async function load(){let r=await sb.from("queue_entries").select("*").eq("unit_code",UNIT).in("status",["AGUARDANDO","CHAMADO","EM_ATENDIMENTO"]).order("created_at",{ascending:true});if(r.error){alert(r.error.message);return}rows=r.data||[];render()}
function subscribe(){sb.channel("agrofila-balanca").on("postgres_changes",{event:"*",schema:"public",table:"queue_entries",filter:"unit_code=eq."+UNIT},load).subscribe()}
function render(){let q=(search.value||"").toLowerCase(),p=product.value;let r=rows.filter(x=>filter==="TODOS"||x.operation===filter).filter(x=>(x.plate+" "+x.name).toLowerCase().includes(q)).filter(x=>!p||x.product===p);cargaList.innerHTML=cards(r.filter(x=>x.operation==="CARGA"));descargaList.innerHTML=cards(r.filter(x=>x.operation==="DESCARGA"));total.textContent=rows.filter(x=>x.status==="AGUARDANDO").length;carga.textContent=rows.filter(x=>x.status==="AGUARDANDO"&&x.operation==="CARGA").length;descarga.textContent=rows.filter(x=>x.status==="AGUARDANDO"&&x.operation==="DESCARGA").length;atendimento.textContent=rows.filter(x=>["CHAMADO","EM_ATENDIMENTO"].includes(x.status)).length}
function cards(a){
  if(!a.length){
    return '<div class="empty">Nenhum veículo na fila.</div>';
  }

  return a.map((x,i)=>{
    const isBalanca=currentProfile?.perfil==="BALANCA";
const isClassificacao=currentProfile?.perfil==="CLASSIFICACAO";

    let operationalActions="";

    if(isBalanca){
      if(x.status==="AGUARDANDO"){
        operationalActions+=`<button class="call" onclick="act('${x.id}','CHAMADO')">CHAMAR</button>`;
      }

      if(x.status==="CHAMADO"){
        operationalActions+=`<button class="arrive" onclick="act('${x.id}','EM_ATENDIMENTO')">VEÍCULO CHEGOU</button>`;
      }

      if(x.status==="EM_ATENDIMENTO"){
        operationalActions+=`<button class="finish" onclick="act('${x.id}','FINALIZADO')">FINALIZAR</button>`;
      }

      operationalActions+=`<button class="danger" onclick="act('${x.id}','CANCELADO')">NÃO COMPARECEU</button>`;
    }

    let releaseActions="";

    if(x.operation==="DESCARGA"){
      if(x.liberado_analise){
        releaseActions+=`<span class="badge">LIBERADO PARA ANÁLISE</span>`;
      }else if(isBalanca){
        releaseActions+=`<button class="call" onclick="liberarAnalise('${x.id}')">LIBERADO PARA ANÁLISE</button>`;
      }else{
        releaseActions+=`<span class="badge">AGUARDANDO LIBERAÇÃO PARA ANÁLISE</span>`;
      }

      if(x.autorizado_descarga){
        releaseActions+=`<span class="badge">AUTORIZADO DESCARGA</span>`;
      }else if(isClassificacao){
        releaseActions+=`<button class="finish" onclick="autorizarDescarga('${x.id}')">AUTORIZADO DESCARGA</button>`;
      }else{
        releaseActions+=`<span class="badge">AGUARDANDO AUTORIZAÇÃO DESCARGA</span>`;
      }
    }

    if(x.operation==="CARGA"){
      if(x.carga_liberada){
        releaseActions+=`<span class="badge">CARGA LIBERADA</span>`;
      }else if(isClassificacao){
        releaseActions+=`<button class="finish" onclick="liberarCarga('${x.id}')">CARGA LIBERADA</button>`;
      }else{
        releaseActions+=`<span class="badge">AGUARDANDO LIBERAÇÃO DA CARGA</span>`;
      }
    }

    return `<div class="card">
      <div class="pos">${i+1}</div>
      <div>
        <div class="plate">${x.plate}</div>
        <div>${x.name}</div>
        <div class="meta">
          ${x.vehicle_type} • ${x.product} •
          ${new Date(x.created_at).toLocaleString("pt-BR",{
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          })}
        </div>
        <span class="badge">${x.status.replaceAll("_"," ")}</span>
        <div class="actions">${releaseActions}</div>
      </div>
      <div class="actions">${operationalActions}</div>
    </div>`;
  }).join("");
}
async function liberarAnalise(id){
  const r=await sb.rpc(
    "agrofila_liberar_para_analise",
    {p_queue_entry_id:id}
  );

  if(r.error){
    alert(r.error.message);
    return;
  }

  alert("Veículo liberado para análise.");
  await load();
}

async function autorizarDescarga(id){
  const r=await sb.rpc(
    "agrofila_autorizar_descarga",
    {p_queue_entry_id:id}
  );

  if(r.error){
    alert(r.error.message);
    return;
  }

  alert("Descarga autorizada.");
  await load();
}

async function liberarCarga(id){
  const r=await sb.rpc(
    "agrofila_liberar_carga",
    {p_queue_entry_id:id}
  );

  if(r.error){
    alert(r.error.message);
    return;
  }

  alert("Carga liberada.");
  await load();
}

async function act(id,status){
  let patch={status};

  if(status==="CHAMADO") patch.called_at=new Date().toISOString();
  if(status==="EM_ATENDIMENTO") patch.started_at=new Date().toISOString();
  if(["FINALIZADO","CANCELADO"].includes(status)) patch.finished_at=new Date().toISOString();

  let r=await sb.from("queue_entries").update(patch).eq("id",id);

  if(r.error){
    alert(r.error.message);
    return;
  }

  if(status==="FINALIZADO"){
    let p=await sb.rpc("agrofila_registrar_pesagem",{p_queue_entry_id:id});

    if(p.error){
      alert("Veículo finalizado, mas houve erro ao registrar a pesagem: "+p.error.message);
      return;
    }

    alert("Pesagem registrada com sucesso.");
  }
}
async function callNext(){let x=rows.find(y=>y.status==="AGUARDANDO");if(!x)return alert("Não há veículos aguardando.");await act(x.id,"CHAMADO")}
function logout(){sb.auth.signOut().then(()=>location.reload())}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(z=>z.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});search.oninput=render;product.onchange=render;setInterval(()=>clock.textContent=new Date().toLocaleTimeString("pt-BR"),1000);
sb.auth.getSession().then(({data})=>{if(data.session)start()})
</script></body></html>
